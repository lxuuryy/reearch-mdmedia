<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mobile preview (dev only)</title>
    <style>
      body { margin: 0; background: #333; display: flex; gap: 14px; padding: 14px; font: 12px sans-serif; color: #fff; }
      figure { margin: 0; }
      iframe { width: 390px; height: 700px; border: 0; background: #fff; display: block; }
      figcaption { padding: 4px 0; }
    </style>
  </head>
  <body>
    <script>
      // Seed a finished run so the results screen renders. SUBMITTED_KEY is set
      // too, so the preview never writes a junk document to Firestore.
      const answers = {};
      for (let n = 0; n < 24; n++) answers["r" + n] = ((n * 7) % 5) + 1;
      answers["c0"] = "A campaign I ran end to end that actually moved their numbers.";
      answers["c1"] = "Running a pitch on my own.";
      answers["c2"] = 2;
      for (let n = 0; n < 12; n++) answers["s" + n] = n % 4;
      localStorage.setItem("mdm-drives-quiz", JSON.stringify({ i: 40, answers, person: { name: "Preview Person", email: "p@mdmedia.com", team: "Accounts" } }));
      localStorage.setItem("mdm-drives-quiz-submitted", JSON.stringify({ at: new Date().toISOString(), name: "Preview Person" }));
    </script>
    <figure><iframe src="/?intro=1" onload="this.contentWindow.localStorage.removeItem('x')"></iframe><figcaption>results 390x700</figcaption></figure>
    <figure><iframe src="/" style="width: 360px; height: 640px"></iframe><figcaption>results 360x640</figcaption></figure>
  </body>
</html>
